[project]
name = "ops-paper-trade"
version = "0.1.0"
description = "Optionomics Trade Ideas webhook bot with Alpaca paper trading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.43.5",
    "fastapi[standard]>=0.139.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "webull-openapi-python-sdk>=2.0.18",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
