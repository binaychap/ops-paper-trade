<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Database records · Paper Trade</title>
<style>
:root{font-family:system-ui,sans-serif;color:#dae5ef;background:#0c1420;color-scheme:dark}body{max-width:1500px;margin:auto;padding:32px}a{color:#71d6c1}h1{font-size:32px;margin-bottom:8px}p{color:#9bacbe}form{display:flex;flex-wrap:wrap;gap:16px;padding:22px;background:#152232;border:1px solid #2c3b4b;border-radius:12px;margin:28px 0}label{display:grid;gap:8px;font-size:13px;color:#bacada}input,select,button{font:inherit;padding:10px;border:1px solid #405167;border-radius:6px;background:#101b29;color:inherit}button{cursor:pointer;align-self:end;background:#23483f}button:disabled{opacity:.45;cursor:default}.table-wrap{overflow:auto;border:1px solid #2c3b4b;border-radius:10px;min-height:140px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:14px;border-bottom:1px solid #293647;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{background:#182637;color:#a7b9ca}tbody tr:hover{background:#192839}nav{display:flex;align-items:center;gap:18px;margin:20px 0}dialog{width:min(800px,85vw);border:1px solid #405167;border-radius:12px;background:#152232;color:#dae5ef}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#message{min-height:24px}small{color:#9bacbe}@media(max-width:600px){body{padding:16px}form{padding:14px}label{width:100%}}
</style></head><body>
<a href="/">← Trade dashboard</a><h1>Database records</h1><p>Explore every stored row across your trading ledgers.</p>
<form id="filters"><label>Table<select id="table"><option value="top_bullish_trades">Bullish trades</option><option value="optionomics_trade_ideas">Trade ideas</option><option value="events">Events</option><option value="scheduled_stock_exits">Scheduled exits</option></select></label><label>Filter time<select id="field"><option value="updated_at">Updated time</option><option value="created_at">Created time</option></select></label><label>From (inclusive)<input id="start" type="datetime-local"></label><label>Until (exclusive)<input id="end" type="datetime-local"></label><button>Apply filters</button><button type="button" id="reset">Clear dates</button><button type="button" id="today">Today</button></form>
<small id="zone"></small><p id="message" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><nav><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button><button id="refresh">Refresh</button></nav><small>Read-only view. Details include the original stored payloads. No orders are placed by this page.</small>
<dialog id="detail"><button id="close">Close</button><h2>Record details</h2><pre id="json"></pre></dialog>
<script>
const $=id=>document.getElementById(id);let page=1,total=0,serial=0;
$('zone').textContent='Date filters and displayed times use your browser timezone: '+Intl.DateTimeFormat().resolvedOptions().timeZone;
function cell(tag,value){const el=document.createElement(tag);el.textContent=value;return el}
async function load(){const request=++serial;$('message').textContent='Loading records…';$('prev').disabled=$('next').disabled=true;const params=new URLSearchParams({table:$('table').value,time_field:$('field').value,page});for(const key of ['start','end'])if($(key).value)params.set(key,new Date($(key).value).toISOString());try{const response=await fetch('/api/records?'+params,{cache:'no-store'});const data=await response.json();if(request!==serial)return;if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'Invalid filter values');total=data.total;$('head').replaceChildren();$('rows').replaceChildren();const header=document.createElement('tr');for(const name of [...data.columns,'Details'])header.append(cell('th',name));$('head').append(header);for(const record of data.records){const row=document.createElement('tr');for(const name of data.columns){let value=record[name];if(name.endsWith('_at')&&value&&!isNaN(Date.parse(value)))value=new Date(value).toLocaleString();const td=cell('td',value===null?'—':String(value));row.append(td)}const td=document.createElement('td'),button=cell('button','View');button.onclick=()=>{const detail={...record};for(const key in detail)if(key.endsWith('_json')&&typeof detail[key]==='string'){try{detail[key]=JSON.parse(detail[key])}catch{}}$('json').textContent=JSON.stringify(detail,null,2);$('detail').showModal()};td.append(button);row.append(td);$('rows').append(row)}$('message').textContent=total?total.toLocaleString()+' matching records':'No records match these filters.';$('page').textContent='Page '+page+' of '+Math.max(1,Math.ceil(total/50));$('prev').disabled=page<=1;$('next').disabled=page*50>=total;}catch(error){if(request!==serial)return;$('head').replaceChildren();$('rows').replaceChildren();$('page').textContent='';$('message').textContent=error.message}}
$('filters').onsubmit=e=>{e.preventDefault();page=1;load()};$('table').onchange=()=>{if($('table').value==='scheduled_stock_exits')$('field').value='updated_at';page=1;load()};$('reset').onclick=()=>{$('start').value=$('end').value='';page=1;load()};$('today').onclick=()=>{const now=new Date();now.setHours(0,0,0,0);const local=date=>new Date(date-date.getTimezoneOffset()*60000).toISOString().slice(0,16);$('start').value=local(now);now.setDate(now.getDate()+1);$('end').value=local(now);page=1;load()};$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('refresh').onclick=load;$('close').onclick=()=>$('detail').close();load();
</script></body></html>
